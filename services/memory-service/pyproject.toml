[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-retrieval-memory-engine"
version = "2.0.0"
description = "Enterprise Agentic RAG Cognitive Memory & LangGraph State Machine Substrate"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Enterprise AI Engineering Team" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

